<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1f33" />
  <meta name="description" content="Controle operacional da G|E Aliança Lima Transportes" />
  <title>G|E Aliança Lima — Controle</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">G|E</div>
        <div><strong>Aliança Lima</strong><span>Transportes</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <span id="storageStatus">Dados salvos neste dispositivo</span>
        <small>v1.0 • PWA</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Abrir menu">☰</button>
        <div>
          <p class="eyebrow">G|E ALIANÇA LIMA TRANSPORTES</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <button class="btn ghost" id="installBtn" hidden>Instalar APP</button>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" id="modalClose" aria-label="Fechar">×</button>
      </div>
      <form id="modalForm" class="form-grid"></form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <input type="file" id="importInput" accept="application/json" hidden />

  <script src="./app.js"></script>
</body>
</html>
