<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G|E Recupera</title><link rel="stylesheet" href="/styles.css"></head><body><div class="wrap"><div class="top"><div><h1>G|E Recupera</h1><div class="muted">Revenue Intelligence • encontre, priorize e recupere receita</div></div><div class="tag">Enterprise Preview</div></div><div class="grid"><div class="card kpi"><span class="muted">Pipeline</span><b id="pipeline">R$ 0</b></div><div class="card kpi"><span class="muted">Valor ponderado</span><b id="weighted">R$ 0</b></div><div class="card kpi"><span class="muted">Abertas</span><b id="open">0</b></div><div class="card kpi"><span class="muted">Sem ação 7+ dias</span><b id="idle">0</b></div></div><div class="main"><section class="card"><h2>Prioridades de recuperação</h2><div class="muted">Score combina valor, probabilidade e urgência.</div><div style="overflow:auto"><table><thead><tr><th>Score</th><th>Empresa</th><th>Tipo</th><th>Valor</th><th>Motivo</th><th>Próxima ação</th></tr></thead><tbody id="rows"></tbody></table></div></section><aside class="card"><h2>Nova oportunidade</h2><form id="form"><label>Empresa</label><input name="company_name" required><div class="row2"><div><label>Tipo</label><select name="kind"><option value="lead">Lead</option><option value="proposal">Proposta</option><option value="renewal">Renovação</option><option value="upsell">Upsell</option><option value="inactive">Inativo</option><option value="collection">Cobrança</option></select></div><div><label>Valor estimado</label><input name="estimated_value" type="number" min="0" step="0.01"></div></div><div class="row2"><div><label>Probabilidade %</label><input name="probability" type="number" min="0" max="100" value="50"></div><div><label>Dias sem ação</label><input name="days_idle" type="number" min="0" value="0"></div></div><label>Próxima ação</label><input name="next_action" placeholder="Ligar, renovar, enviar proposta..."><button type="submit">Salvar oportunidade</button></form></aside></div></div><script src="/app.js"></script></body></html>
